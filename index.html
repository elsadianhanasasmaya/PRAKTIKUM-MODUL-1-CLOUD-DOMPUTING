<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azure Web Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #12345a;
      background: linear-gradient(135deg, #eaf8ff, #b8e9ff);
    }
    main {
      width: min(100%, 560px);
      padding: 42px 30px;
      text-align: center;
      background: white;
      border-radius: 18px;
      box-shadow: 0 14px 40px rgba(0, 60, 120, 0.16);
    }
    .cloud { font-size: 52px; margin-bottom: 12px; }
    h1 { margin: 0 0 12px; color: #0877c9; }
    p { line-height: 1.6; color: #40556b; }
    a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 22px;
      border-radius: 8px;
      background: #0877c9;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover { background: #075b99; }
    footer { margin-top: 26px; font-size: 13px; color: #718096; }
  </style>
</head>
<body>
  <main>
    <div class="cloud" aria-hidden="true">☁️</div>
    <h1>Azure Web Test</h1>
    <p>Website statis berhasil dijalankan.</p>
    <p>Halaman ini dibuat menggunakan <strong>HTML dan CSS</strong> dan siap digunakan untuk praktikum Web Server on Cloud.</p>
    <a href="https://azure.microsoft.com/" target="_blank" rel="noopener noreferrer">Pelajari Microsoft Azure</a>
    <footer>Praktikum Cloud Computing · Web Server on Cloud</footer>
  </main>
</body>
</html>
